name: Fim da Black Friday

# Em 1º de dezembro de 2026, às 00h05 (Fortaleza), devolve a página de links
# (index.html) e a página de notícias (noticias.html) para a versão normal.
# O portfólio não muda: ele não tem visual de Black Friday.

on:
  schedule:
    - cron: "5 3 1 12 *"   # 03:05 UTC = 00:05 em Fortaleza, dia 1º de dezembro
  workflow_dispatch:        # permite voltar antes, manualmente, pela aba Actions

permissions:
  contents: write

jobs:
  voltar-ao-normal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar versão normal (sem Black Friday)
        run: |
          # Só age em 2026, para não repetir em dezembro dos próximos anos
          if [ "$(date -u +%Y)" != "2026" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Fora de 2026: nada a fazer."; exit 0
          fi
          # Versão normal das páginas, antes da Black Friday
          git checkout 9e1effb7df18ac3f889692f551e7c3793bce6687 -- index.html noticias.html
          git config user.name "vectrya-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html noticias.html
          if git diff --cached --quiet; then
            echo "As páginas já estão na versão normal."
          else
            git commit -m "Fim da Black Friday: volta a versão normal das páginas"
            git push
          fi
